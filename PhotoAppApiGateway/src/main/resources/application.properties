server.port=8082
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8010/eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

# next two line are weird - recommend use both if u want lower-case service-names.
# first option is standard but does not work
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
# second option is deprecated but does work.
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# note:
#   Old config item "spring.cloud.gateway.discovery.locator.enabled"
#   replaced by "spring.cloud.gateway.server.webflux.discovery.locator.enabled".
#spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.server.webflux.routes[0].id= users-status-check
spring.cloud.gateway.server.webflux.routes[0].uri= lb://users-ws
spring.cloud.gateway.server.webflux.routes[0].predicates[0]= Path=/users/status/check
spring.cloud.gateway.server.webflux.routes[0].predicates[1]= Method=GET
spring.cloud.gateway.server.webflux.routes[0].filters[0]= RemoveRequestHeader=Cookie



spring.cloud.gateway.server.webflux.routes[1].id=users-status-check-rewrite-example
spring.cloud.gateway.server.webflux.routes[1].uri=lb://users-ws
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/foo/bar/users/status/check
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.server.webflux.routes[1].filters[1]=RewritePath=/foo/bar/users/status/check, /users/status/check
